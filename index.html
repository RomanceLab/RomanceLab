<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romance Lab | Start here</title>

<!--
  ============================================================
  ROMANCE LAB TRIAGE FORM
  ------------------------------------------------------------
  ONE THING TO EDIT before going live: paste your free
  Web3Forms access key below (get one in 30 seconds at
  https://web3forms.com — it emails every submission to you).
  Until you do, the form still runs and shows the thank-you
  screen, it just will not send anything.
  ============================================================

<script>
  var WEB3FORMS_ACCESS_KEY = "6051cf5d-32f9-462b-bedd-9a5881e557ee";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FFFFFF;
    --card:#FFFFFF;
    --ink:#141414;
    --muted:#767676;
    --line:#E4E4E4;
    --rose:#141414;
    --rose-deep:#000000;
    --rose-soft:#F5F5F5;
    --warn-bg:#F5F5F5;
    --warn-ink:#555555;
    --radius:2px;
    --serif:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:32px 18px 64px;
    min-height:100vh;
  }
  .shell{width:100%;max-width:580px;}

  .brand{display:flex;align-items:center;gap:9px;margin-bottom:24px;}
  .brand .mark{font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);}
  .brand .flask{width:18px;height:18px;color:var(--ink);}

  .progress{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .track{flex:1;height:2px;background:#E4E4E4;overflow:hidden;}
  .fill{height:100%;width:14%;background:var(--ink);transition:width .35s ease;}
  .count{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.12em;text-transform:uppercase;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:32px 30px 28px;
  }
  @media (max-width:480px){ .card{padding:24px 20px 22px;} }

  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px;}
  h1.q{font-family:var(--sans);font-weight:700;font-size:27px;line-height:1.18;margin:0 0 6px;letter-spacing:-.01em;}
  @media (max-width:480px){ h1.q{font-size:22px;} }
  .sub{font-size:14.5px;color:var(--muted);margin:0 0 20px;}

  .opts{display:flex;flex-direction:column;gap:10px;margin:0;}
  .opt{
    position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 16px;border:1px solid var(--line);border-radius:2px;
    background:#fff;cursor:pointer;transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:#B5B5B5;background:#FAFAFA;}
  .opt.is-checked{border-color:var(--ink);background:var(--rose-soft);}
  .opt input{position:absolute;opacity:0;width:1px;height:1px;}
  .opt .label{font-size:15.5px;color:var(--ink);flex:1;}
  .opt .label small{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;font-weight:400;}
  .opt .tick{flex:none;width:18px;height:18px;color:var(--ink);opacity:0;transition:opacity .15s;}
  .opt.is-checked .tick{opacity:1;}
  .opt:focus-within{outline:2px solid var(--ink);outline-offset:2px;}

  label.field{display:block;margin-bottom:16px;}
  label.field .lab{display:block;font-size:14px;font-weight:500;margin-bottom:6px;}
  label.field .opt-tag{color:var(--muted);font-weight:400;}
  input.txt, textarea.txt{
    width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);
    padding:12px 13px;border:1px solid var(--line);border-radius:2px;background:#fff;transition:border-color .15s;
  }
  input.txt:focus, textarea.txt:focus{outline:none;border-color:var(--ink);}
  textarea.txt{resize:vertical;min-height:84px;}

  .notice{margin-top:14px;padding:12px 14px;border-radius:2px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;line-height:1.5;}
  .notice svg{flex:none;margin-top:1px;}
  .notice.warn{background:var(--warn-bg);color:var(--warn-ink);border-left:3px solid #B5B5B5;}
  .notice.block{background:#fff;color:var(--ink);border:1px solid var(--ink);}
  .hidden{display:none;}

  .err-inline{color:var(--ink);font-weight:500;font-size:13px;margin-top:12px;display:none;}
  .err-inline.show{display:block;}

  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;}
  button{
    font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.02em;
    padding:13px 26px;border-radius:2px;border:1px solid #C9C9C9;
    background:#fff;color:var(--ink);transition:background .15s, border-color .15s, transform .05s;
    display:inline-flex;align-items:center;gap:8px;
  }
  button:hover{background:#F5F5F5;}
  button:active{transform:scale(.985);}
  button.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  button.primary:hover{background:#000;}
  button.primary:disabled{background:#CFCFCF;border-color:#CFCFCF;cursor:not-allowed;}
  button.ghost{visibility:hidden;}

  .sum-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .sum-row:last-child{border-bottom:none;}
  .sum-row .k{color:var(--muted);}
  .sum-row .v{text-align:right;font-weight:500;max-width:62%;}

  .done{text-align:center;padding:14px 6px 8px;}
  .done .heart{width:46px;height:46px;border-radius:50%;background:var(--rose-soft);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .done h1{font-family:var(--sans);font-weight:700;font-size:25px;letter-spacing:-.01em;margin:0 0 8px;}
  .done p{color:var(--muted);font-size:15px;margin:0 auto;max-width:380px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><span class="mark">Romance Lab</span><svg class="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6.5L4.6 18.4A1.5 1.5 0 0 0 5.9 21h12.2a1.5 1.5 0 0 0 1.3-2.6L14 9.5V3"/><path d="M7.7 15h8.6"/></svg></div>

  <div class="progress" id="progress">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">Step 1 of 7</span>
  </div>

  <div class="card" id="card"></div>

  <div class="nav" id="nav">
    <button id="back" class="ghost" type="button">Back</button>
    <button id="next" class="primary" type="button">Continue</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var A = { q1:null, q2:"", q3:null, q4:null, q5:null, q6:null,
            name:"", email:"", phone:"", story:"" };

  var Q1 = [
    ["a","Marriage proposal"], ["b","Anniversary"], ["c","Romantic surprise"],
    ["d","Milestone celebration"], ["e","Something else"]
  ];
  var Q3 = [
    ["a","Within 2 weeks"], ["b","2 to 4 weeks"], ["c","1 to 3 months"],
    ["d","3 months or more"], ["e","Flexible or not sure"]
  ];
  var Q4 = [
    ["a","An intimate, candlelit moment","Just the two of you"],
    ["b","A series of little magical moments","Building to the reveal, shared with close friends and family"],
    ["c","A big, bold, cinematic grand gesture","An unforgettable statement"],
    ["d","I am not sure yet","Help me figure it out"]
  ];
  var Q5 = [
    ["a","$200 to $499"], ["b","$500 to $999"],
    ["c","$1,000 to $2,999"], ["d","$3,000 or more"]
  ];
  var Q6 = [
    ["a","The Equation","I give you an idea and a plan for you to action at your own pace"],
    ["b","The Formula","I give you an idea and a plan, plus I give you a list of recommended vendors that I can help you get quote from"],
    ["c","The Full Experiment","We land on an idea together, I share the plan, and coordinate logistics"]
  ];

  var LABELS = {
    q1:{a:"Marriage proposal",b:"Anniversary",c:"Romantic surprise",d:"Milestone celebration",e:"Something else"},
    q3:{a:"Within 2 weeks",b:"2 to 4 weeks",c:"1 to 3 months",d:"3 months or more",e:"Flexible or not sure"},
    q4:{a:"Intimate, candlelit moment",b:"A series of magical moments",c:"Bold, cinematic grand gesture",d:"Not sure yet"},
    q5:{a:"$200 to $499",b:"$500 to $999",c:"$1,000 to $2,999",d:"$3,000 or more"},
    q6:{a:"The Spark",b:"The Black Book",c:"The Whole Shebang"}
  };

  var ORDER = ["q1","q2","q3","q4","q5","q6","q7","summary"];
  var current = "q1";

  var card = document.getElementById("card");
  var fill = document.getElementById("fill");
  var count = document.getElementById("count");
  var back = document.getElementById("back");
  var next = document.getElementById("next");

  function visible(id){ return id === "q2" ? A.q1 === "e" : true; }
  function visibleList(){ return ORDER.filter(visible); }
  function icon(kind){
    if(kind==="warn") return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
    return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v4h1"/></svg>';
  }

  function choiceHTML(name, opts){
    var h = '<div class="opts" role="radiogroup">';
    opts.forEach(function(o){
      var sub = o[2] ? '<small>'+o[2]+'</small>' : '';
      h += '<label class="opt"><input type="radio" name="'+name+'" value="'+o[0]+'">'
         + '<span class="label">'+o[1]+sub+'</span>'
         + '<span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></label>';
    });
    return h + '</div>';
  }

  function render(){
    var vis = visibleList();
    var pos = vis.indexOf(current) + 1;
    var total = vis.length;
    fill.style.width = Math.round((pos/total)*100) + "%";
    count.textContent = "Step " + pos + " of " + total;
    back.className = (vis.indexOf(current) === 0) ? "ghost" : "";
    next.textContent = (current === "summary") ? "Submit" : (current === "q7") ? "Review" : "Continue";

    if(current === "q1") screenChoice("What's the occasion?","", "q1", Q1);
    else if(current === "q2") screenText();
    else if(current === "q3") screenChoice("When is it happening?","", "q3", Q3, q3Extra);
    else if(current === "q4") screenChoice("Which sounds more like you?","", "q4", Q4);
    else if(current === "q5") screenChoice("What's your total budget in AUD?","Including our planning fee, not only flowers and dinner.", "q5", Q5, q5Extra);
    else if(current === "q6") screenChoice("How involved do you want me to be?","", "q6", Q6, q6Extra);
    else if(current === "q7") screenDetails();
    else if(current === "summary") screenSummary();

    wireChoice();
  }

  function shell(eyebrow, title, sub, body, extra){
    card.innerHTML =
      (eyebrow ? '<p class="eyebrow">'+eyebrow+'</p>' : '') +
      '<h1 class="q">'+title+'</h1>' +
      (sub ? '<p class="sub">'+sub+'</p>' : '') +
      body +
      '<div id="extra"></div>' +
      '<p class="err-inline" id="err">Please choose an option to continue.</p>';
    if(extra) extra();
  }

  function screenChoice(title, sub, name, opts, extra){
    shell("", title, sub, choiceHTML(name, opts), extra);
    var saved = A[name];
    if(saved){
      var el = card.querySelector('input[value="'+saved+'"]');
      if(el){ el.checked = true; el.closest(".opt").classList.add("is-checked"); }
    }
  }

  function q3Extra(){
    var box = document.getElementById("extra");
    box.innerHTML = '<div class="notice warn hidden" id="warn">'+icon("warn")+'<span>Oops, this is a tight timeline that may limit what we can do for you.</span></div>';
    toggleWarn();
  }
  function toggleWarn(){
    var w = document.getElementById("warn");
    if(w) w.classList.toggle("hidden", A.q3 !== "a");
  }

  function q5Extra(){ document.getElementById("extra").innerHTML = '<div id="blockmsg"></div>'; showBlock("q5"); }
  function q6Extra(){ document.getElementById("extra").innerHTML = '<div id="blockmsg"></div>'; showBlock("q6"); }

  var EXP_COST = { a:150, b:500, c:1000, d:0 };
  var FEE = { a:150, b:350, c:700 };
  var BANDMAX = { a:499, b:999, c:2999, d:Infinity };

  function budgetErr(){
    if(!A.q4 || !A.q5) return null;
    if(BANDMAX[A.q5] >= EXP_COST[A.q4]) return null;
    if(A.q4 === "b")
      return "A series of magical moments usually starts around $500. Lift the budget, or choose a different type of experience.";
    if(A.q4 === "c")
      return "A bold, cinematic grand gesture usually starts around $1,000. Lift the budget, or choose a different type of experience.";
    return null;
  }
  function involveErr(){
    if(!A.q4 || !A.q5 || !A.q6) return null;
    var need = EXP_COST[A.q4] + FEE[A.q6];
    if(BANDMAX[A.q5] >= need) return null;
    var rounded = Math.round(need/50)*50;
    var forExp = (A.q4 === "a" || A.q4 === "d") ? "" : " for " + LABELS.q4[A.q4].toLowerCase();
    var levers = "Lift your budget, choose a lighter package";
    if(A.q4 === "b" || A.q4 === "c") levers += ", or pick a simpler experience";
    return LABELS.q6[A.q6] + forExp + " needs a budget of around $" + rounded.toLocaleString() + ". " + levers + ".";
  }
  function showBlock(which){
    var host = document.getElementById("blockmsg");
    if(!host) return;
    var msg = which === "q5" ? budgetErr() : involveErr();
    host.innerHTML = msg ? '<div class="notice block">'+icon("info")+'<span>'+msg+'</span></div>' : "";
  }

  function screenText(){
    shell("", "Tell me more about the occasion", "A sentence or two is plenty.",
      '<textarea class="txt" id="q2" placeholder="What are we celebrating?"></textarea>');
    var t = document.getElementById("q2"); t.value = A.q2;
    t.addEventListener("input", function(){ A.q2 = t.value; hideErr(); });
  }

  function screenDetails(){
    shell("Almost there", "Your details", "",
      '<label class="field"><span class="lab">Full name</span><input class="txt" id="d-name" type="text" autocomplete="name"></label>'+
      '<label class="field"><span class="lab">Email</span><input class="txt" id="d-email" type="email" autocomplete="email" inputmode="email"></label>'+
      '<label class="field"><span class="lab">Phone</span><input class="txt" id="d-phone" type="tel" autocomplete="tel" inputmode="tel"></label>'+
      '<label class="field"><span class="lab">Want to share a bit of your story or idea? <span class="opt-tag">(optional)</span></span><textarea class="txt" id="d-story" placeholder="Their name, your story so far, anything you are already picturing..."></textarea></label>');
    bind("d-name","name"); bind("d-email","email"); bind("d-phone","phone"); bind("d-story","story");
  }
  function bind(id, key){
    var el = document.getElementById(id); if(!el) return;
    el.value = A[key];
    el.addEventListener("input", function(){ A[key] = el.value; hideErr(); });
  }

  function screenSummary(){
    var rows = "";
    function row(k,v){ if(!v) return ""; return '<div class="sum-row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
    rows += row("Occasion", LABELS.q1[A.q1]);
    if(A.q1 === "e") rows += row("Details", A.q2);
    rows += row("Timing", LABELS.q3[A.q3]);
    rows += row("Vision", LABELS.q4[A.q4]);
    rows += row("Budget", LABELS.q5[A.q5]);
    rows += row("Involvement", LABELS.q6[A.q6]);
    rows += row("Name", A.name);
    rows += row("Email", A.email);
    rows += row("Phone", A.phone);
    if(A.story) rows += row("Story", A.story);
    card.innerHTML = '<p class="eyebrow">One last look</p><h1 class="q">Here is what you told me</h1>'+
      '<p class="sub">Check it over, then send it my way and I will be in touch.</p>'+ rows +
      '<p class="err-inline" id="err">Something went wrong sending this. Please try again.</p>';
  }

  function doneScreen(){
    document.getElementById("progress").style.visibility = "hidden";
    document.getElementById("nav").style.display = "none";
    card.innerHTML = '<div class="done"><span class="heart"><svg width="22" height="22" viewBox="0 0 24 24" fill="#141414" stroke="none"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.6 2 5 5.4 5c2 0 3.4 1.2 4.6 2.8C11.2 6.2 12.6 5 14.6 5 18 5 19.6 8.6 22 11.8 19.5 16.4 12 21 12 21z"/></svg></span>'+
      '<h1>Thank you</h1><p>Your answers are on their way to me. I will read every word and come back to you soon with the next step.</p></div>';
  }

  function wireChoice(){
    card.querySelectorAll('input[type="radio"]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var name = inp.name;
        A[name] = inp.value;
        card.querySelectorAll('input[name="'+name+'"]').forEach(function(x){ x.closest(".opt").classList.remove("is-checked"); });
        inp.closest(".opt").classList.add("is-checked");
        hideErr();
        if(name === "q3") toggleWarn();
        if(name === "q4" || name === "q5") showBlock("q5");
        if(name === "q6") showBlock("q6");
      });
    });
  }

  function showErr(msg){ var e = document.getElementById("err"); if(e){ if(msg) e.textContent = msg; e.classList.add("show"); } }
  function hideErr(){ var e = document.getElementById("err"); if(e) e.classList.remove("show"); }

  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  function canAdvance(){
    if(current === "q1") return A.q1 ? true : (showErr("Please choose an option to continue."), false);
    if(current === "q2") return A.q2.trim() ? true : (showErr("Please tell me a little about the occasion."), false);
    if(current === "q3") return A.q3 ? true : (showErr("Please choose an option to continue."), false);
    if(current === "q4") return A.q4 ? true : (showErr("Please choose an option to continue."), false);
    if(current === "q5"){
      if(!A.q5) return showErr("Please choose an option to continue."), false;
      if(budgetErr()) return showBlock("q5"), false;
      return true;
    }
    if(current === "q6"){
      if(!A.q6) return showErr("Please choose an option to continue."), false;
      if(involveErr()) return showBlock("q6"), false;
      return true;
    }
    if(current === "q7"){
      if(!A.name.trim()) return showErr("Please add your name."), false;
      if(!validEmail(A.email)) return showErr("Please add a valid email."), false;
      if(!A.phone.trim()) return showErr("Please add a phone number."), false;
      return true;
    }
    return true;
  }

  function go(dir){
    var vis = visibleList();
    var i = vis.indexOf(current);
    if(dir > 0){
      if(!canAdvance()) return;
      if(current === "summary"){ submit(); return; }
      current = vis[Math.min(i+1, vis.length-1)];
    } else {
      current = vis[Math.max(i-1, 0)];
    }
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function submit(){
    var payload = {
      subject: "New Romance Lab enquiry: " + (LABELS.q1[A.q1] || ""),
      Occasion: LABELS.q1[A.q1] || "",
      Occasion_details: A.q1 === "e" ? A.q2 : "",
      Timing: LABELS.q3[A.q3] || "",
      Vision: LABELS.q4[A.q4] || "",
      Budget: LABELS.q5[A.q5] || "",
      Involvement: LABELS.q6[A.q6] || "",
      Name: A.name, Email: A.email, Phone: A.phone, Story: A.story
    };
    var keySet = WEB3FORMS_ACCESS_KEY && WEB3FORMS_ACCESS_KEY.indexOf("PASTE") === -1;
    if(!keySet){ doneScreen(); return; }
    next.disabled = true; next.textContent = "Sending...";
    payload.access_key = WEB3FORMS_ACCESS_KEY;
    fetch("https://api.web3forms.com/submit", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); })
      .then(function(res){ if(res.success){ doneScreen(); } else { next.disabled=false; next.textContent="Submit"; showErr("Something went wrong sending this. Please try again."); } })
      .catch(function(){ next.disabled=false; next.textContent="Submit"; showErr("Something went wrong sending this. Please try again."); });
  }

  next.addEventListener("click", function(){ go(1); });
  back.addEventListener("click", function(){ go(-1); });
  render();
})();
</script>
</body>
</html>
